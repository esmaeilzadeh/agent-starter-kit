# Adapter data for Claude Code. Refresh when Anthropic's catalog or prices change.

runtime: claude
notes: >
  Aliases (haiku, sonnet, opus, fable) follow Claude Code's model picker.
  CLAUDE_CODE_SUBAGENT_MODEL overrides every child's frontmatter model if set.

roles:
  thinking: sonnet
  typing: sonnet
  adversarial: opus

pools:
  cheap: sonnet
  diverse: opus

families:
  - haiku
  - sonnet
  - opus
  - fable
  - claude

implementation_family: sonnet

handoff:
  capabilities:
    catalog: unknown
    identity: unknown
    switch: unknown
  manual_action: "select {model} in Claude Code's active model selector"
  evidence: https://docs.anthropic.com/en/docs/claude-code/model-config

picker:
  - haiku
  - sonnet
  - opus
  - fable
  - inherit
